# Enables Ingress Operator Gateway API controller (OCP 4.19+).
# https://docs.redhat.com/en/documentation/openshift_container_platform/4.19/html/networking/ingress_operator
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: openshift-default
spec:
  controllerName: openshift.io/gateway-controller/v1