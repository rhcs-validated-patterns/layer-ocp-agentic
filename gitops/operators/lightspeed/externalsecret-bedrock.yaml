# Requires ClusterSecretStore for AWS Secrets Manager (installer ESO + platform metadata on ROSA).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lightspeed-bedrock
  namespace: openshift-lightspeed
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: lightspeed-bedrock
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: SECRETS_MANAGER_SECRET_NAME