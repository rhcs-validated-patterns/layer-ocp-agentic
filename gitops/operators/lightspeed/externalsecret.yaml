apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lightspeed-azure-openai
  namespace: openshift-lightspeed
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: customer-key-vault
  target:
    name: lightspeed-azure-openai
    creationPolicy: Owner
  data:
    - secretKey: apitoken
      remoteRef:
        key: azure-openai-api-key