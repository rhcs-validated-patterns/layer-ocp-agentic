# Applied by gitops-bootstrap.sh when agentic.json defines MCP OIDC (see docs/guides/mcp-gateway-networking.md).
# Pattern: https://docs.redhat.com/en/documentation/red_hat_connectivity_link/1.5/html/secure_your_traffic/mcp-gateway-authentication
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: mcp-gateway-oidc
  namespace: openshift-ingress
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: aro-agentic-mcp-gateway
    sectionName: mcps
  defaults:
    when:
      - predicate: "!request.path.contains('/.well-known')"
    rules:
      authentication:
        mcp-oidc:
          jwt:
            issuerUrl: REPLACE_OAUTH_ISSUER_URL
      response:
        unauthenticated:
          code: 401
          headers:
            WWW-Authenticate:
              value: Bearer resource_metadata=REPLACE_MCP_WELL_KNOWN_URL
          body:
            value: |
              {
                "error": "Unauthorized",
                "message": "Authentication required."
              }