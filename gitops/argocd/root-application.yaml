apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentic-stack
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/rhcs-validated-patterns/layer-ocp-agentic.git
    targetRevision: main
    path: gitops/overlays/public
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true