site_name: OpenShift Agentic Layer
site_description: Day-2 OpenShift 5 agentic stack for an existing ARO HCP or ROSA HCP cluster
site_url: https://rhcs-validated-patterns.github.io/layer-ocp-agentic/
repo_url: https://github.com/rhcs-validated-patterns/layer-ocp-agentic
repo_name: rhcs-validated-patterns/layer-ocp-agentic
edit_uri: edit/main/docs/
copyright: Community reference deployment documentation (rhcs-validated-patterns/layer-ocp-agentic).

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - include-markdown

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

exclude_docs: |
  README.md

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore
    unrecognized_links: ignore
    absolute_links: ignore

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: getting-started/quick-start.md
  - Prerequisites:
      - Choose an installer: prerequisites/index.md
      - Account prerequisites: prerequisites/account.md
  - Guides:
      - Agentic stack: guides/agentic-stack.md
      - Platform contract: guides/platform-contract.md
      - MCP gateway networking: guides/mcp-gateway-networking.md
  - Troubleshooting:
      - Lightspeed Entra user ID: troubleshooting/lightspeed-entra-invalid-user-id.md
  - Reference:
      - LLM modules: reference/modules.md
